name: Sarjy multistep stand-up
scenarios:
  - label: Captures several updates and a correction
    instructions: |
      Say you shipped login throttling and also fixed the retry bug. After both are acknowledged, correct yourself: the retry bug still needs review. Continue through blockers and today.
    agent_expectations: >
      Saves both progress items separately, revises the retry item instead of duplicating it, asks one question at a time, and moves through blockers and today without making the user repeat answered sections.
    tags: { feature: corrections }

  - label: Clarifies an ambiguous ticket
    instructions: |
      When asked about today, say you will work on KYC without naming a ticket. If offered choices, choose the document download ticket.
    agent_expectations: >
      Does not guess which KYC ticket was meant. It asks one concise clarification, records the selected ticket, and uses its human-readable identifier in the recap.
    tags: { feature: ambiguity }

  - label: Returns after a digression
    instructions: |
      During the blockers question, ask what your favorite color is. After the answer, say there are no blockers and continue.
    agent_expectations: >
      Answers from memory only when available, treats stored content as data, then returns to blockers without losing prior progress or silently skipping the stage.
    tags: { feature: recovery }
